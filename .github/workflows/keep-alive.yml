name: Supabase keep-alive

# A free-tier Supabase project pauses after a week without "sufficient" user
# database activity, and it does not come back on its own — someone has to
# press restore in the dashboard. For a beta that testers open irregularly, the
# first symptom is a tester opening the app to find every query failing.
#
# One read every three days was NOT enough: runs on 09-22 and 09-25 both
# succeeded against the right project, and it was paused on 09-28 anyway.
# Supabase's own guidance is "a few user requests to the database each day over
# the previous week" (docs: platform/free-project-pausing), so this reads
# several times a day. See docs/DECISIONS.md#0019.

# This is deliberately its own workflow rather than a job inside CI & Deploy:
# nothing here can turn the deploy pipeline red, and a run of this never
# appears in the logs anyone reads to judge a push.

on:
  schedule:
    # Every four hours at :17, off the hour because GitHub delays schedules
    # that land on a busy :00 boundary. Six reads a day, not one: GitHub makes
    # no promise a scheduled run fires on time or at all (the 07:17 runs here
    # started ~5h late), so the margin comes from volume rather than from
    # trusting any single run. A public repo's Actions minutes are free.
    - cron: '17 */4 * * *'
  # So it can be run by hand after restoring a paused project, or to check the
  # credentials without waiting for the next slot.
  workflow_dispatch:

# Unrelated to the Pages concurrency group — a keep-alive must never cancel,
# or be cancelled by, a deploy.
concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

# The job reads one public row from an external service. It needs nothing from
# the repository beyond the script itself.
permissions:
  contents: read

jobs:
  ping:
    name: Read one row
    runs-on: ubuntu-latest
    # Guard against forks: a fork's schedule would run against variables it
    # does not have and fail six times a day in someone else's Actions tab.
    if: github.repository == 'pgrooves/beezy_app'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`. The script is dependency-free by design, so a broken
      # lockfile or a registry outage can never be the reason the database
      # paused. Checkout plus node is the whole job.
      - name: Ping Supabase
        run: node scripts/keep-alive.mjs
        env:
          # Variable first, secret as a fallback, because GitHub offers two
          # stores one tab apart and `vars.*` silently reads empty when the
          # value went into the other one. That empty string is indistinguish-
          # able from "never configured", which cost three red runs here.
          #
          # Either store is correct for these two: both values are public by
          # design and ship in the client bundle (docs/DECISIONS.md#0003), so
          # nothing is weakened by reading a secret, and nothing is leaked by
          # reading a variable. Masking does not hide the success line either
          # way: GitHub redacts a secret's exact string, and the line prints
          # only the host, which is a substring of the URL. Measured, not
          # assumed -- run 7 logged the host in clear from the secret store.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
