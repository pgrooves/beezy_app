<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the app paint into the notch and
         home-indicator areas; safe-area insets do the rest. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />

    <!-- Beta is a closed test on a public Pages URL. Keep it out of search.
         Must be removed before store submission — see docs/COMPLIANCE.md. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Beezy Luxury Detailing</title>
    <meta
      name="description"
      content="Mobile luxury auto detailing in Greater New Orleans. Make life easy, call Beezy."
    />

    <!-- Two theme-colors so the iOS status bar matches the active scheme. -->
    <meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Beezy" />
    <!-- black-translucent lets content run under the status bar; the app pads
         with safe-area insets instead. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./favicon.png" />

    <!-- Fonts are self-hosted (public/fonts, generated by scripts/fetch-fonts.mjs)
         so the app renders offline and makes no third-party request.
         See docs/DECISIONS.md#0007. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
