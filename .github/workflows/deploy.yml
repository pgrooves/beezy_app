name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# main must always be deployable: a broken main is a broken install on a
# tester's phone. Verify runs on every PR; deploy only from main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify brand assets are up to date
        # The committed assets must match what the pipeline produces, so a
        # source change cannot silently ship stale icons.
        run: |
          npm run brand
          if ! git diff --quiet -- public/; then
            echo "::error::public/ is stale. Run 'npm run brand' and commit the result."
            git diff --stat -- public/
            exit 1
          fi

      - name: Build
        # Both values are public by design (DECISIONS.md#0003), so either
        # store is correct; reading both removes the Variables-vs-Secrets tab
        # mistake (#0019). A build without them would ship an app where nobody
        # can sign in while every check stays green, so refuse to make one.
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are not set in Settings → Secrets and variables → Actions (Variables or Secrets tab)."
            exit 1
          fi
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify referenced images shipped
        # A fixture pointing at a photo that was never added renders a broken
        # tile; nothing else in the build notices.
        run: npm run check:assets

      - name: Verify PWA installability
        # Lighthouse dropped its PWA category in v12, so these invariants are
        # asserted directly. See scripts/check-pwa.mjs.
        run: npm run check:pwa

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  policies:
    name: Database policies
    # Applies every migration to a plain Postgres and runs the RLS tests as
    # the real roles. This is the check that proves the anon key is safe to
    # ship (DECISIONS.md#0003), so it runs on every PR, not just against prod.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run policy tests
        run: supabase/tests/run.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

  lighthouse:
    name: Lighthouse PWA audit
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Serve and audit
        # Mirror the real Pages layout — the site lives under /<repo>/, and
        # serving dist at the root would make every audited URL a 404. The
        # directory is taken from the repo name rather than typed, so it
        # always matches the base path Vite built against.
        run: |
          repo='${{ github.event.repository.name }}'
          mkdir -p "site/$repo"
          cp -r dist/. "site/$repo/"
          npx --yes serve site -l 4173 &
          npx --yes wait-on "http://localhost:4173/$repo/" -t 60000
          npx --yes @lhci/cli@0.14.x autorun --collect.url="http://localhost:4173/$repo/"
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [verify, policies]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
